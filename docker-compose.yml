name: careersync
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment:
    CAREERSYNC_DOTENV: "0"
    DB_HOST: db
    DB_PORT: "5432"
    DB_USER: ${DB_USER:-postgres}
    DB_PASSWORD: ${DB_PASSWORD:-postgres}
    DB_NAME: ${DB_NAME:-careersync_db}
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-demo-secret-change-before-sharing}
    TALENT_ID_SECRET: ${TALENT_ID_SECRET:-local-demo-talent-secret-change-before-sharing}
    AI_MODE: ${AI_MODE:-llm}
    LLM_PROVIDER: ${LLM_PROVIDER:-groq}
    LLM_API_KEY: ${LLM_API_KEY:-${GROQ_API_KEY:-}}
    LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
    # docs/DECISIONS.md D26: the demo uses e5 (about 1 GB, downloaded once into the model-cache volume)
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-base}
    # M5 voice interview: the backend signs the seeker's join token with these; the `agent` service gets the same values.
    # Empty counts as unset: the join route then answers 503 and the rest of the app is unaffected
    INTERVIEW_AGENT_SECRET: ${INTERVIEW_AGENT_SECRET:-}
    LIVEKIT_URL: ${LIVEKIT_URL:-}
    LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
    LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
  volumes:
    - model-cache:/root/.cache/huggingface

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-careersync_db}
    ports:
      - "127.0.0.1:${COMPOSE_DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  init:
    <<: *backend
    command: ["python", "/app/scripts/docker_init.py"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${COMPOSE_BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # The voice interviewer (M5 S5; docs/DECISIONS.md D56, D80, D86). Only with `--profile voice`, so a plain `docker compose up` needs no LiveKit keys.
  # It reads no .env file: Compose passes these variables. It reaches the backend over the Compose network (not the published port).
  agent:
    profiles: ["voice"]
    build:
      context: .
      dockerfile: interview_agent/Dockerfile
    environment:
      INTERVIEW_AGENT_BACKEND_URL: http://backend:8000
      INTERVIEW_AGENT_SECRET: ${INTERVIEW_AGENT_SECRET:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # The agent's mode is its own: INTERVIEW_AGENT_AI_MODE when set, else the backend's AI_MODE.
      AI_MODE: ${INTERVIEW_AGENT_AI_MODE:-${AI_MODE:-llm}}
      # Empty means the agent's default (3 s)
      INTERVIEW_AGENT_LLM_TIMEOUT_SECONDS: ${INTERVIEW_AGENT_LLM_TIMEOUT_SECONDS:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:${COMPOSE_FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  model-cache:
