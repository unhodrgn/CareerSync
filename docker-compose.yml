name: careersync
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment:
    CAREERSYNC_DOTENV: "0"
    DB_HOST: db
    DB_PORT: "5432"
    DB_USER: ${DB_USER:-postgres}
    DB_PASSWORD: ${DB_PASSWORD:-postgres}
    DB_NAME: ${DB_NAME:-careersync_db}
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-demo-secret-change-before-sharing}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hashing-ngram-v1}
  volumes:
    - model-cache:/root/.cache/huggingface

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-careersync_db}
    ports:
      - "127.0.0.1:${COMPOSE_DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  init:
    <<: *backend
    command: ["python", "/app/scripts/docker_init.py"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${COMPOSE_BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:${COMPOSE_FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  model-cache:
