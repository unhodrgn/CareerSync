<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">CareerSync recruitment evaluation flow</title>
  <desc id="description">HR reviews the criteria and weights before publishing a job. An application with AI consent and a confirmed CV is scored in the background. Stored scores are weighted and ranked for HR, who decides the application status.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#506478"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #192f46; }
      .title { font-size: 30px; font-weight: 700; }
      .label { font-size: 19px; font-weight: 700; }
      .detail { font-size: 15px; fill: #3b5166; }
      .box { fill: #f1f5f9; stroke: #afbfcc; stroke-width: 1.5; }
      .human { fill: #e6f5f0; stroke: #368278; stroke-width: 2; }
      .arrow { fill: none; stroke: #506478; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="630" fill="white"/>
  <text class="title" x="32" y="50">CareerSync recruitment evaluation flow</text>
  <g>
    <rect class="human" x="32" y="86" width="340" height="100" rx="12"/>
    <text class="label" x="52" y="123">HR reviews or edits criteria</text>
    <text class="detail" x="52" y="151">Job description, categories and weights</text>
    <rect class="box" x="430" y="86" width="340" height="100" rx="12"/>
    <text class="label" x="450" y="123">Validate and publish</text>
    <text class="detail" x="450" y="151">Check weight total and criterion text</text>
    <rect class="box" x="828" y="86" width="340" height="100" rx="12"/>
    <text class="label" x="848" y="123">Accept application</text>
    <text class="detail" x="848" y="151">AI consent and confirmed CV required</text>
    <path class="arrow" d="M372 136H425"/>
    <path class="arrow" d="M770 136H823"/>
  </g>
  <g>
    <rect class="box" x="828" y="245" width="340" height="122" rx="12"/>
    <text class="label" x="848" y="277">Score criteria in the background</text>
    <text class="detail" x="848" y="305">Rules and evidence retrieval by category</text>
    <text class="detail" x="848" y="329">Optional LLM for judgment criteria</text>
    <text class="detail" x="848" y="350">Verify quoted evidence against masked CV</text>
    <rect class="box" x="430" y="245" width="340" height="122" rx="12"/>
    <text class="label" x="450" y="291">Store criterion results</text>
    <text class="detail" x="450" y="319">Scores, evidence and explanations</text>
    <rect class="box" x="32" y="245" width="340" height="122" rx="12"/>
    <text class="label" x="52" y="291">Compute Fit and rank</text>
    <text class="detail" x="52" y="319">Weighted mean of stored scores</text>
    <path class="arrow" d="M998 186V240"/>
    <path class="arrow" d="M828 306H775"/>
    <path class="arrow" d="M430 306H377"/>
  </g>
  <g>
    <rect class="human" x="32" y="430" width="340" height="100" rx="12"/>
    <text class="label" x="52" y="467">HR reviews the ranking</text>
    <text class="detail" x="52" y="495">Inspect Fit and the supporting evidence</text>
    <rect class="human" x="430" y="430" width="340" height="100" rx="12"/>
    <text class="label" x="450" y="467">HR updates application status</text>
    <text class="detail" x="450" y="495">Recruiter decides next steps</text>
    <path class="arrow" d="M202 367V425"/>
    <path class="arrow" d="M372 480H425"/>
    <path class="arrow" d="M86 530V567H18V306H27" stroke-dasharray="6 5"/>
    <text class="detail" x="102" y="571">If HR edits weights: reuse stored scores and recalculate Fit</text>
  </g>
</svg>
